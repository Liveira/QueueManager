<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUFFYCATO STUDIO PRO (WIP)</title>
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/attachments/876798609851572245/1506492796314321027/G8DIcqwboAAFD-U.png?ex=6a0e763f&is=6a0d24bf&hm=dcb818e91b214ad54bcf0f387cc10f067e940e51e504fbcf677aa24698181163&">
    <meta property="og:title" content="FLUFFYCATO STUDIO PRO (WIP)">
    <meta property="og:description" content="mrow x3">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://cdn.discordapp.com/attachments/876798609851572245/1506492796314321027/G8DIcqwboAAFD-U.png">
    <meta name="theme-color" content="#000080"> 
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="win98-window">
        <div class="title-bar">
            <span>FLUFFYCATO STUDIO PRO (WIP)</span>
            <span id="btn-close">X</span>
        </div>
        <div class="dev-notice-wrapper">
            <div class="dev-notice-main">FLUFFYCATO</div>
            <div class="dev-notice-sub">Work in progress. </div>
        </div>
        <div class="main-content">
            <div class="toolbar">
                <div class="tool-section">
                    <span class="label">Layers</span>
                    <div class="layers-list" id="layers-list"></div>
                    <div class="layer-actions">
                        <button class="btn btn-sm" id="btn-add-layer">+</button>
                        <button class="btn btn-sm" id="btn-rm-layer">-</button>
                        <button class="btn btn-sm" id="btn-up-layer">↑</button>
                        <button class="btn btn-sm" id="btn-down-layer">↓</button>
                    </div>
                </div>
                <div class="tool-section">
                    <span class="label">Tools</span>
                    <div class="btn active" id="btn-brush">Brush</div>
                    <div class="btn" id="btn-eraser">Eraser</div>
                    <span class="label">Brush Type</span>
                    <select id="brush-type">
                        <option value="classic">Classic</option>
                        <option value="spray">Spray</option>
                        <option value="marker">Marker</option>
                    </select>
                </div>
                <div class="tool-section brush-size">
                    <div class="range-header">
                        <span class="label">Brush Size</span>
                        <div class="range-value">
                            <input type="number" id="thickness-number" min="1" max="100" step="0.1" value="10.0">
                            <span class="unit">px</span>
                        </div>
                    </div>
                    <div class="range-track">
                        <input type="range" id="thickness" min="1" max="100" step="0.1" value="10">
                    </div>
                </div>
                <div class="tool-section">
                    <span class="label">Colors</span>
                    <div class="color-palette" id="color-palette"></div>
                    <div class="custom-color-wrapper">
                        <input type="color" id="custom-color" value="#000000">
                        <span>Custom Color</span>
                    </div>
                </div>
                <div class="tool-section">
                    <span class="label">History</span>
                    <div class="btn" id="btn-undo">Undo</div>
                    <div class="btn" id="btn-redo">Redo</div>
                </div>
                <div class="spacer"></div>
                <div class="tool-section">
                    <div class="btn" id="btn-clear">Clear Layer</div>
                    <div class="btn" id="btn-save">Save  PNG</div>
                </div>
            </div>
            <div class="canvas-wrapper" id="canvas-wrapper">
                <div id="cursor-preview"></div>
            </div>
        </div>
    </div>
    <script src="index.js?v=2"></script>
</body>
</html>
