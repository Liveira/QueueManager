<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 7 Aero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- DESKTOP -->
    <div id="desktop" class="desktop">
        <div class="wallpaper"></div>
        <div class="aero-streaks"></div>
        <div class="aero-bokeh"></div>

        <!-- Ícones do Desktop -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-app="computer">
                <div class="icon-placeholder computer">💻</div>
                <span>Computador</span>
            </div>
            <div class="desktop-icon" data-app="recycle">
                <div class="icon-placeholder recycle">🗑️</div>
                <span>Lixeira</span>
            </div>
            <div class="desktop-icon" data-app="explorer">
                <div class="icon-placeholder folder">📁</div>
                <span>Explorador</span>
            </div>
            <div class="desktop-icon" data-app="internet">
                <div class="icon-placeholder globe">🌐</div>
                <span>Internet</span>
            </div>
        </div>

        <!-- Janelas dinâmicas -->
        <div id="windowsContainer"></div>
    </div>

    <!-- TASKBAR -->
    <div class="taskbar">
        <div class="taskbar-left">
            <button class="start-button" id="startBtn">
                <span class="start-orb"></span>
            </button>
            <div class="quick-launch">
                <div class="ql-icon folder">📁</div>
                <div class="ql-icon globe">🌐</div>
            </div>
        </div>
        <div class="taskbar-middle" id="taskbarMiddle"></div>
        <div class="taskbar-right">
            <div class="system-tray">
                <div class="tray-icon">🔊</div>
                <div class="tray-icon">📶</div>
                <div class="clock" id="clock">00:00</div>
            </div>
        </div>
    </div>

    <!-- START MENU -->
    <div id="startMenu" class="start-menu hidden">
        <div class="start-menu-left">
            <div class="start-menu-items">
                <div class="start-menu-item"><span class="sm-icon">🌐</span><span>Internet Explorer</span></div>
                <div class="start-menu-item"><span class="sm-icon">📝</span><span>Bloco de Notas</span></div>
                <div class="start-menu-item"><span class="sm-icon">🧮</span><span>Calculadora</span></div>
                <div class="start-menu-item"><span class="sm-icon">🎨</span><span>Paint</span></div>
                <div class="start-menu-sep"></div>
                <div class="start-menu-item"><span class="sm-icon">⚙️</span><span>Painel de Controle</span></div>
                <div class="start-menu-item shutdown-item"><span class="sm-icon power">⏻</span><span>Desligar</span></div>
            </div>
        </div>
        <div class="start-menu-right">
            <div class="user-profile">
                <div class="user-avatar"></div>
                <div class="user-name">Usuário</div>
            </div>
            <div class="recent-list">
                <div class="recent-item">📁 Documentos</div>
                <div class="recent-item">🖼️ Imagens</div>
                <div class="recent-item">🎵 Músicas</div>
                <div class="recent-item">💻 Computador</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
