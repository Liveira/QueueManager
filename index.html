<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueManager — Tema Aero (Windows 7 style)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Para usar a fonte Frutiger, instale-a no Windows e ajuste o CSS se necessário. -->
</head>
<body>
    <div class="desktop">
        <div class="wallpaper"></div>

        <div class="window" style="left:80px; top:80px;">
            <div class="titlebar">
                <div class="titlebar-left">
                    <img class="icon-small" src="icons/folder.png" alt="Ícone">
                    <span class="title">QueueManager</span>
                </div>
                <div class="titlebar-right">
                    <button class="btn">_</button>
                    <button class="btn">□</button>
                    <button class="btn close">×</button>
                </div>
            </div>

            <div class="toolbar">
                <img class="icon" src="icons/explorer.png" alt="Explorer">
                <img class="icon" src="icons/computer.png" alt="Computer">
                <img class="icon" src="icons/network.png" alt="Network">
            </div>

            <div class="content">
                <p>Mockup visual estilo Frutiger Aero (Windows 7).</p>
                <p>Coloque os ícones reais do seu Windows dentro da pasta <strong>icons/</strong>.</p>
            </div>
        </div>

        <div class="taskbar">
            <div class="start">Iniciar</div>
            <div class="taskbar-icons">
                <img class="task-icon" src="icons/explorer.png" alt="Explorer">
            </div>
            <div class="tray">12:00</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
